{% extends 'main/layout.html' %}
{% block content %}
<div class="container mt-5 text-center">
    <img src="{{ pet.photo.url }}" class="rounded-circle shadow" style="width: 200px; height: 200px; object-fit: cover; border: 5px solid #fff;">
    <h1 class="mt-3">{{ pet.name }}</h1>
    <span class="badge bg-info text-dark fs-5">{{ pet.get_species_display }}</span>
    
    <div class="mt-4 card mx-auto" style="max-width: 500px;">
        <div class="card-body text-start">
            <p><strong><i class="fa-solid fa-cake-candles"></i> Дата народження:</strong> {{ pet.birth_date }}</p>
            <p><strong><i class="fa-solid fa-user-tag"></i> Власник:</strong> {{ pet.owner.user.phone_number }}</p>
        </div>
    </div>

    <div class="mt-4">
        <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Повернутись до профілю</a>
    </div>
</div>
{% endblock %}
