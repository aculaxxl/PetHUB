{% extends 'main/layout.html' %}

{% block title %}Вхід за номером телефону{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Вхід у PetHub</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="phone" class="form-label">Номер телефону</label>
                    <input type="text" name="phone" id="phone" class="form-control" placeholder="+380XXXXXXXXX" required>
                    <div class="form-text">Введіть номер, на який ми відправимо код.</div>
                </div>
                <button type="submit" class="btn btn-primary">Отримати код</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
