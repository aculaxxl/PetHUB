
services:
  backend:
    build: ./backend              
    volumes:
      - ./backend:/app            
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env        
    restart: always

  frontend:
    build: ./frontend            
    volumes:
      - ./frontend:/app        
      - /app/node_modules         
    ports:
      - "5173:5173"               
    environment:
      - CHOKIDAR_USEPOLLING=true  
    restart: always
